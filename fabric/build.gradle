plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}
repositories { maven { url = 'https://maven.siphalor.de/' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}"
    modImplementation "dev.ftb.mods:ftb-library-fabric:${ftb_library_version}"
    modImplementation "dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}"
    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        if (project.hasProperty('multiplayerTests')) {
            clientTwo {
                client()
                setConfigName('Fabric Second Test Client')
                runDir('runs/client-two')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
