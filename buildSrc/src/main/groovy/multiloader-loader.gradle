plugins {
    id 'multiloader-common'
}
tasks.named('processResources').configure { inputs.property('integrationTests', rootProject.hasProperty('integrationTests')) }

if (rootProject.hasProperty('integrationTests')) {
    sourceSets.main.java.srcDir(rootProject.file('common/src/integration/java'))
    tasks.named('processResources').configure {
        doLast {
            def config = destinationDir.toPath().resolve('bmpquests.mixins.json').toFile()
            def parsed = new groovy.json.JsonSlurper().parse(config)
            parsed.mixins.add('IntegrationMixin')
            config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed))
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
